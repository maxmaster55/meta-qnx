# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qnx"
BBFILE_PATTERN_qnx = "^${LAYERDIR}/"
BBFILE_PRIORITY_qnx = "10"

LAYERDEPENDS_qnx = "core"
LAYERSERIES_COMPAT_qnx = "scarthgap"

# qnx-cmake.bbclass drives the host's cmake/ninja rather than building native
# recipes for them, so they must be allowed through bitbake's sanitized PATH.
# This has to be global config -- HOSTTOOLS symlinks are created once at cooker
# startup, so setting it from a bbclass is too late. bitbake.conf only ever
# appends to HOSTTOOLS, so appending here (parsed earlier) survives.
HOSTTOOLS += "cmake ninja"

# qnx-disk.bbclass writes a block map beside the disk image when this is
# available, which makes flashing much faster. NONFATAL because it is genuinely
# optional -- it is not part of the SDP and the image is complete without it.
# bmaptool shells out to df to identify the filesystem, so that is needed too.
HOSTTOOLS_NONFATAL += "bmaptool df"
