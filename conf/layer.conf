# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Bridges to layers that may or may not be in the build. Each is inert unless
# the named collection is present, so meta-qnx keeps LAYERDEPENDS = "core" and a
# build without meta-qt6 never sees these files.
BBFILES_DYNAMIC += " \
    qt6-layer:${LAYERDIR}/dynamic-layers/qt6-layer/recipes-*/*/*.bb \
    qt6-layer:${LAYERDIR}/dynamic-layers/qt6-layer/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "qnx"
BBFILE_PATTERN_qnx = "^${LAYERDIR}/"
BBFILE_PRIORITY_qnx = "10"

LAYERDEPENDS_qnx = "core"
LAYERSERIES_COMPAT_qnx = "scarthgap"

# ---------------------------------------------------------------------------
# Paths, in the style of DL_DIR and SSTATE_DIR
# ---------------------------------------------------------------------------
# Defaults live here rather than in the classes so that both qnx-sdp.bbclass
# (which builds against an SDP) and qnx-sdp-packages.bbclass (which installs
# one, and therefore must work before any SDP exists) see the same value, and so
# that a plain assignment in local.conf always wins.
#
# Like DL_DIR, this defaults inside the build directory so a fresh checkout
# works with no configuration: `bitbake -c install_sdp qnx-sdp` will create an
# SDP there. Point it at an existing install to use one you already have.
QNX_SDP_ROOT ??= "${TOPDIR}/qnx-sdp"

# The working tree holding application sources, for recipes that build one in
# place. Empty means those recipes simply do not appear.
QNX_PROJECT_SRC ??= ""

# ---------------------------------------------------------------------------
# QNX's OSS package repository
# ---------------------------------------------------------------------------
# Where prebuilt open-source .apk packages come from. Here for the same reason
# QNX_SDP_ROOT is: qnx-apk.bbclass fetches one package, and the search task in
# the qnx-sdp recipe reads the whole catalogue, and both must agree on the
# coordinates.
QNX_OSS_REPO ??= "https://repo.oss.qnx.com"
QNX_OSS_ARCH ??= "aarch64"

# Channels `bitbake -c search_oss qnx-sdp` reads. QNX serves these four; the
# 8.0.3 pair are by far the largest (~2400 packages, including most of the
# familiar OSS libraries), while the 8.0.4 pair are a smaller curated set.
# 8.0.4/qnx-core currently answers 403 to an anonymous index request, which the
# search task reports and skips rather than failing on.
QNX_OSS_SEARCH_CHANNELS ??= "8.0.4/qnx-extra 8.0.4/qnx-core 8.0.3/extra 8.0.3/core"

# ---------------------------------------------------------------------------
# Shared .build fragments
# ---------------------------------------------------------------------------
# Directories searched for `#include` lines in an image's .build template (see
# qnx_read_template in qnx-sdp.bbclass). Every layer appends its own, which is
# what lets a host image in one layer and a guest image in another share a
# fragment without either knowing where the other lives.
#
# Appended, never assigned: an assignment here would silently drop whatever a
# layer parsed earlier had contributed.
QNX_TEMPLATE_INCLUDE_PATH += "${LAYERDIR}/files/ifs"

# qnx-cmake.bbclass drives the host's cmake/ninja rather than building native
# recipes for them, so they must be allowed through bitbake's sanitized PATH.
# This has to be global config -- HOSTTOOLS symlinks are created once at cooker
# startup, so setting it from a bbclass is too late. bitbake.conf only ever
# appends to HOSTTOOLS, so appending here (parsed earlier) survives.
# meson matters as much as the others: a recipe whose source tree already has a
# configured build directory will run only ninja and appear to work without it.
HOSTTOOLS += "cmake ninja meson pkg-config"

# qnx-disk.bbclass writes a block map beside the disk image when this is
# available, which makes flashing much faster. NONFATAL because it is genuinely
# optional -- it is not part of the SDP and the image is complete without it.
# bmaptool shells out to df to identify the filesystem, so that is needed too.
HOSTTOOLS_NONFATAL += "bmaptool df patchelf"

# The CommonAPI code generators are Eclipse applications and need a JRE. They
# run in the environment of whichever recipe generates bindings, not the one
# that installs them, so -- like every other host tool here -- this has to be
# global config rather than something the generators recipe can declare.
HOSTTOOLS_NONFATAL += "java"
