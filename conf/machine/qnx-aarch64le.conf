#@TYPE: Machine
#@NAME: qnx-aarch64le
#@DESCRIPTION: QNX 8.0 aarch64le target, built with the QNX SDP toolchain.
#
# This machine is deliberately thin. Nothing here builds a Linux kernel, a
# bootloader, or a rootfs -- every target artifact comes either from the QNX SDP
# or from a recipe that inherits qnx-sdp.bbclass. The machine exists so that
# MACHINE is set and deploy artifacts land in a per-machine directory.

require conf/machine/include/arm/arch-armv8a.inc

# The QNX name for this target. Used as:
#   - the $PROCESSOR / $ARCH that mkifs expects (see qnx-ifs.bbclass)
#   - the subdirectory name inside $QNX_TARGET and inside our stage tree
QNX_PROCESSOR = "aarch64le"

# qcc -V variant. Run `qcc -V` to see the full list offered by the installed SDP.
QNX_VARIANT = "gcc_ntoaarch64le"

# GNU-style tool prefix for the binutils shipped in $QNX_HOST/usr/bin.
QNX_TOOL_PREFIX = "aarch64-unknown-nto-qnx8.0.0-"
